:root{color-scheme:light dark;--bg:light-dark(#f2f5f8,#0b1a2a);--ink:light-dark(#1a1a1a,#eef3f8);--card:light-dark(#ffffff,#13283d);--line:light-dark(#d8e0e8,#24405a);--mut:light-dark(#5a6670,#9fb3c6);--blue:light-dark(#0077c8,#3aa3f0);--onblue:light-dark(#fff,#06121e);--pink:#e2001a;--pinkt:light-dark(#c4001a,#ff6b6b);--soon:light-dark(#9a5200,#ffb85c);--band:linear-gradient(135deg,#0089e0,#005aa8);--bandink:#fff;--sh:light-dark(0 1px 2px #0b1a2a14,0 1px 2px #0006)}

function scopeIds(key){if(!key)return null;if(key.startsWith('g:'))return new Set((grp(key)||{}).members||[]);

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4000)}

async function write(path,data,merge){try{const r=doc(fdb,path);if(merge)await updateDoc(r,data);else await setDoc(r,data);return true}catch(e){console.error(e);toast(errMsg(e));return false}}

async function enablePush(){
  try{if(!S.srv||!S.srv.push||!app||!auth.currentUser||notifPerm()!=='granted'||!('serviceWorker' in navigator))return false;
    if(!(await pushSupported()))return false;
    const reg=await navigator.serviceWorker.ready,opt={serviceWorkerRegistration:reg};if(S.srv.vapid)opt.vapidKey=S.srv.vapid;
    const tk=await getToken(getMessaging(app),opt);if(!tk)return false;
    const key=S.me+'|'+tk;if(localStorage.getItem('ukol-push')===key)return true;
    const r=await fetch('/api/push-register',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+await auth.currentUser.getIdToken()},body:JSON.stringify({token:tk})});
    if(r.ok&&(await r.json()).ok){localStorage.setItem('ukol-push',key);return true}return false}catch(e){console.error('push',e);return false}}
async function disablePush(){

function pushBanner(){

function expand(t){if(!String(t.assignee||'').startsWith('g:'))return[t];const g=grp(t.assignee);if(!g)return[t];
  return[...new Set((g.members||[]).map(resolve).filter(Boolean))].map(id=>({...t,assignee:id,group:t.assignee.slice(2)}))}

function notes(){
  const me=S.me,seen=meM().seenAt||0,out=[];if(!me||!S.members[me])return out;
  for(const [id,t] of Object.entries(S.tasks)){if(!t)continue;
    if(t.kind==='info'){if((t.createdAt||0)>seen&&t.author!==me)out.push({id,t,type:'info'});continue}
    if(!isMine(t))continue;
    if((t.assignedAt||t.createdAt||0)>seen&&t.assignedBy!==me&&t.status!=='done')out.push({id,t,type:'new'});
    if(t.status!=='done'&&t.due){const d=daysTo(t.due);if(d<=rd())out.push({id,t,type:d<0?'late':'soon',d})}}
  const o={late:0,soon:1,new:2,info:3};return out.sort((a,b)=>o[a.type]-o[b.type]);
}
function badge(n){
  document.title=(n?`(${n}) `:'')+'Úkolovník obchodu – Konica Minolta';
  try{if(navigator.setAppBadge){n?navigator.setAppBadge(n):navigator.clearAppBadge()}}catch(e){}
  if(badge.last===n)return;badge.last=n;
  if(!n){$('#fav').href='/favicon.png';return}
  if(!FAVIMG.complete||!FAVIMG.naturalWidth){FAVIMG.onload=()=>{badge.last=null;badge(n)};return}
  try{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
    x.drawImage(FAVIMG,0,0,64,64);
    if(n){x.fillStyle='#e2001a';x.beginPath();x.arc(47,17,17,0,7);x.fill();x.fillStyle='#fff';x.font='bold 21px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(n>9?'9+':String(n),47,18)}
    $('#fav').href=c.toDataURL()}catch(e){}
}

      const opts={body:x.t.title,icon:'/icon-192.png',badge:'/icon-192.png',tag:k};
      navigator.serviceWorker&&navigator.serviceWorker.ready?navigator.serviceWorker.ready.then(r=>r.showNotification(x.type==='new'?'Nový úkol pro vás':'Nová informace',opts)).catch(()=>{}):null}}

  <p><a href="#informace" class="lnk">Všechny informace →</a></p></aside></div>`;

function filtered(){
  const q=norm(S.q);
  return tasks().filter(([,t])=>{
    if(S.scope==='moje'&&!isMine(t))return false;
    if(S.scope==='zadane'&&t.author!==S.me)return false;
    if(S.scope==='vse'&&!inScope(t,S.fGroup))return false;
    if(S.fStatus==='aktivni'&&t.status==='done')return false;
    if(S.fStatus==='late'&&!isLate(t))return false;
    if(S.fStatus==='soon'&&!isSoon(t))return false;
    if(S.fStatus==='done'&&t.status!=='done')return false;
    if(S.fSource&&t.source!==S.fSource)return false;
    if(q&&!norm([t.title,t.desc,nm(t.assignee),t.meeting].join(' ')).includes(q))return false;
    return true}).sort(S.fStatus==='done'?(a,b)=>(b[1].doneAt||0)-(a[1].doneAt||0):byDue);
}

function vInfo(){
  return `<section class="head"><div><h1>Informace pro tým</h1><p class="lead">Sdělení, která nevyžadují splnění. Dotazníky a ankety dál běží v Teams.</p></div><button class="btn pri" data-act="new" data-kind="info">Nová informace</button></section>
  <div style="max-width:760px">${infos().map(([id,t])=>infoCard(id,t)).join('')||'<p class="empty">Zatím žádné informace.</p>'}</div>`;
}
function vImport(){

  return `<section class="head"><div><h1>Import zápisu z porady</h1><p class="lead">Vložte text zápisu nebo nahrajte soubor (.txt, .md, .docx, přepis z Teams). Aplikace navrhne úkoly a řešitele — lidi i skupiny; před uložením vše zkontrolujete.</p></div></section>

}

  <div class="acts"><button class="btn pri" data-act="group">Nová skupina</button></div></div>

  <div class="acts"><button class="btn pri" data-act="saveCfg">Uložit nastavení</button></div></div>
  <div class="sec"><h2>Export</h2><p class="hint">Všechny úkoly a informace jako CSV (oddělovač středník) do schránky — vložíte přímo do Excelu.</p><div class="acts"><button class="btn" data-act="csv">Kopírovat CSV</button></div></div>`;

function renderTop(){
  const ok=canWrite(),n=notes().length,links=[['prehled','Přehled'],['ukoly','Úkoly'],['informace','Informace'],['import','Import<span class="lg">&nbsp;z porady</span>']];if(isAdmin())links.push(['sprava','Správa']);
  $('#nav').innerHTML=ok?links.map(([k,l])=>`<a href="#${k}"${S.view===k?' aria-current="page"':''}>${l}</a>`).join(''):'';
  const b=$('#bellN');b.textContent=n>99?'99+':String(n);b.hidden=!n;$('#bell').setAttribute('aria-label',`Upozornění: ${n}`);$('#bell').hidden=!ok;$('#menuBtn').hidden=!ok;
  $('#meName').textContent=meM().name||'';$('#meIni').textContent=(meM().name||'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();$('#meRole').textContent=ok?(isAdmin()?'Administrátor':'Uživatel')+(meM().location?' · '+meM().location:''):'';$('.me').hidden=!ok;
  $('#banner').textContent=S.note||'';$('#banner').hidden=!S.note;$('#newBtn').hidden=!ok;
  $('#dlLoc').innerHTML=uniq('location').map(v=>`<option value="${esc(v)}">`).join('');$('#dlPos').innerHTML=uniq('position').map(v=>`<option value="${esc(v)}">`).join('');
}
function render(){
  const a=document.activeElement,fid=a&&a.id,ss=a&&a.selectionStart;
  renderTop();renderAuth();
  if(!canWrite()){$('#main').innerHTML='';badge(0);return}
  if(S.view==='sprava'&&!isAdmin())S.view='prehled';
  document.body.dataset.view=S.view;
  $('#main').innerHTML=S.loading?'<p class="empty">Načítám úkoly…</p>':({prehled:vDash,ukoly:vTasks,informace:vInfo,import:vImport,sprava:vAdmin})[S.view]();
  badge(notes().length);
  if(!$('#bellP').hidden)$('#bellP').innerHTML=bellHTML();
  if(fid&&$('#layer').hidden){const el=document.getElementById(fid);if(el&&el!==a){el.focus();try{if(ss!=null)el.setSelectionRange(ss,ss)}catch(e){}}}
}
function bellHTML(){
  const n=notes(),lab={new:'Nový úkol pro vás',info:'Nová informace',soon:'Blíží se termín',late:'Po termínu'};
  const when=x=>x.type==='soon'?(x.d===0?' · dnes':` · za ${x.d} ${pl(x.d,'den','dny','dní')}`):x.type==='late'?` · ${-x.d} ${pl(-x.d,'den','dny','dní')}`:'';
  return `<div class="poph"><b>Upozornění</b>${n.some(x=>x.type==='new'||x.type==='info')?'<button class="lnk" data-act="seen">Označit nové jako přečtené</button>':''}</div>`+
  (n.length?`<ul>${n.map(x=>`<li><button data-act="open" data-id="${esc(x.id)}"><span class="nt ${x.type==='info'?'inf':x.type}">${lab[x.type]}${when(x)}</span>${esc(x.t.title)}</button></li>`).join('')}</ul>`:`<p class="hint" style="padding:0 10px 10px">Nic nového. Na blížící se termín upozorníme ${rd()} ${pl(rd(),'den','dny','dní')} předem.</p>`);
}
function closeMenu(){$('#nav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false')}
function closeBell(){$('#bellP').hidden=true;$('#bell').setAttribute('aria-expanded','false')}
function close(){$('#layer').hidden=true;$('#layer').innerHTML='';S.gEdit=null}
function panel(label,inner){closeBell();$('#layer').innerHTML=`<div class="ov" data-act="close"></div><aside class="panel" role="dialog" aria-modal="true" aria-label="${esc(label)}">${inner}</aside>`;$('#layer').hidden=false}
const xBtn='<button class="x" data-act="close" aria-label="Zavřít">×</button>';

const canManage=t=>canWrite()&&(isAdmin()||t.author===S.me);
function whoDone(id,t){const b=batchOf(t),man=canManage(t);
  const done=b.filter(([,x])=>x.status==='done').length,multi=b.length>1;
  const rows=b.slice().sort((a,c)=>(a[1].status==='done'?0:1)-(c[1].status==='done'?0:1)||(a[1].doneAt||0)-(c[1].doneAt||0)||nm(a[1].assignee).localeCompare(nm(c[1].assignee),'cs'));
  const have=new Set(b.map(([,x])=>x.assignee));
  const addable=mList().filter(([mid])=>!have.has(mid));
  return `<h3>${multi?`Řešitelé a kdo úkol splnil <span class="hint">(${done} z ${b.length})</span>`:'Řešitelé'}</h3>
  ${multi?`<div class="prog" role="img" aria-label="Splněno ${done} z ${b.length}"><i style="width:${done/b.length*100}%"></i></div>`:''}
  <ul class="who">${rows.map(([xid,x])=>`<li class="${x.status==='done'?'ok':''}${xid===id?' me':''}${man&&multi?' rm':''}"><span class="wi" aria-hidden="true">${x.status==='done'?'✓':''}</span><button class="lnk" data-act="open" data-id="${esc(xid)}">${esc(nm(x.assignee))}</button><span class="ws">${x.status==='done'?'splněno '+esc(fmtT(x.doneAt)):esc(ST[x.status]||'')}${x.status!=='done'&&isLate(x)?' · po termínu':''}</span>${man&&multi?`<button class="wx" data-act="rmAs" data-id="${esc(xid)}" data-of="${esc(id)}" aria-label="Odebrat řešitele ${esc(nm(x.assignee))}" title="Odebrat řešitele">×</button>`:''}</li>`).join('')}</ul>
  ${man?`<div class="addas"><select id="dAdd" data-of="${esc(id)}" aria-label="Přidat řešitele"><option value="">+ Přidat řešitele nebo skupinu…</option>${gList().length?`<optgroup label="Skupiny (přidá chybějící členy)">${gList().map(([gid,g])=>`<option value="g:${esc(gid)}">${esc(g.name)}</option>`).join('')}</optgroup>`:''}${addable.length?`<optgroup label="Lidé">${addable.map(([mid,m])=>`<option value="${esc(mid)}">${esc(m.name)}${m.location?' – '+esc(m.location):''}</option>`).join('')}</optgroup>`:''}</select></div>
  <p class="hint">Nový řešitel dostane vlastní kopii úkolu${S.srv&&S.srv.mail?' a e-mail':''}. Odebráním se jeho kopie úkolu smaže.</p>`:''}`}
// Přidání řešitelů k již zveřejněnému úkolu: každý dostane kopii se stejnou dávkou.
async function addAssignees(id,val){
  const t=S.tasks[id];if(!t||!canManage(t))return;const b=batchOf(t),have=new Set(b.map(([,x])=>x.assignee));
  const want=(val.startsWith('g:')?((grp(val)||{}).members||[]).map(resolve).filter(Boolean):[val]).filter(x=>!have.has(x));
  if(!want.length){toast('Všichni vybraní už úkol mají.');return}
  let batch=t.batch;
  if(!batch){batch=rid('b');for(const [xid] of b){if(!await write('tasks/'+xid,{batch},true))return}}
  const now=Date.now(),base={kind:'task',title:t.title,desc:t.desc||'',author:t.author,createdAt:t.createdAt,source:t.source||'',meeting:t.meeting||'',due:t.due||'',batch};
  const list=want.map(a=>({...base,assignee:a,status:'open',doneAt:0,assignedAt:now,assignedBy:S.me,updatedAt:now,log:[{t:now,by:S.me,a:'přidán jako řešitel'}]}));
  const ids=await addTasks(list);if(!ids)return;
  toast(`Přidáno: ${want.map(nm).join(', ')}`);notify(ids);
  await new Promise(r=>setTimeout(r,80));openTask(id);
}
async function removeAssignee(xid,of){
  const x=S.tasks[xid];if(!x||!canManage(x))return;if(batchOf(x).length<2){toast('Úkol musí mít aspoň jednoho řešitele — použijte Předat.');return}
  const back=xid===of?batchOf(x).map(([i])=>i).find(i=>i!==xid):of;
  if(await del('tasks/'+xid)){toast('Řešitel odebrán: '+nm(x.assignee));await new Promise(r=>setTimeout(r,80));openTask(back)}
}
function openTask(id){
  const t=S.tasks[id];if(!t)return;const info=t.kind==='info';
  const g=String(t.assignee||'').startsWith('g:')?grp(t.assignee):null;
  panel('Detail',`<div class="ph"><span class="kind">${info?'Informace':'Úkol'}${t.source?' · '+esc(SRC[t.source]||''):''}</span>${xBtn}</div>
  <label>Název<input id="dT" value="${esc(t.title)}"></label>
  <label style="margin-top:12px">Popis<textarea id="dD" rows="4">${esc(t.desc||'')}</textarea></label>
  ${info?'':`<div class="grid2"><label>Termín<input type="date" id="dDue" value="${esc(t.due||'')}"></label><label>Stav<select id="dSt"${canDone(t)?'':' disabled title="Stav mění jen řešitel"'}>${Object.entries(ST).map(([k,v])=>`<option value="${k}"${k===t.status?' selected':''}>${v}</option>`).join('')}</select></label><label>Zdroj<select id="dSrc">${sOpts(t.source)}</select></label></div>`}
  <div class="acts"><button class="btn pri" data-act="saveTask" data-id="${esc(id)}">Uložit změny</button>${isAdmin()?`<button class="btn danger" data-act="delTask" data-id="${esc(id)}">Smazat</button>`:''}</div>
  ${info?'':`<h3>Řešitel: ${esc(nm(t.assignee))}</h3>${canDone(t)?'':`<p class="hint">Úkol může označit jako splněný jen řešitel${g?' — tento starší úkol je přidělený celé skupině, předejte ho konkrétní osobě':''}.</p>`}
  <div class="deleg"><select id="dTo" aria-label="Předat komu">${mOpts(t.assignee,false)}</select><input id="dNote" placeholder="Poznámka k předání" aria-label="Poznámka k předání"><button class="btn" data-act="delegate" data-id="${esc(id)}">Předat</button></div>`}
  ${info?'':whoDone(id,t)}
  <h3>Historie</h3><ol class="log">${(t.log||[]).slice().reverse().map(l=>`<li><time>${esc(fmtT(l.t))}</time>${esc(nm(l.by))}: ${esc(l.a)}</li>`).join('')||'<li>Bez záznamů</li>'}</ol>
  <p class="hint">Zadal(a) ${esc(nm(t.author))}, ${esc(fmtT(t.createdAt))}${t.meeting?` · z porady „${esc(t.meeting)}“`:''}${t.group&&S.groups[t.group]?` · rozděleno ze skupiny ${esc(S.groups[t.group].name)}`:''}</p>`);
  $('.panel .x').focus();
}
function openNew(kind){
  S.newKind=kind||'task';const k=S.newKind;S.nSel=new Set([S.me]);
  panel('Nový záznam',`<div class="ph"><h2 style="margin:0">Nový záznam</h2>${xBtn}</div>
  <div class="seg" role="group" aria-label="Typ"><button data-act="nk" data-v="task" aria-pressed="${k==='task'}">Úkol ke splnění</button><button data-act="nk" data-v="info" aria-pressed="${k==='info'}">Jen informace</button></div>
  <label style="margin-top:16px">Název<input id="nT" maxlength="160"></label>
  <label style="margin-top:12px">Popis<textarea id="nD" rows="4"></textarea></label>
  <div id="nTF"${k==='info'?' hidden':''}><label style="margin-top:12px">Řešitelé</label><div id="nChips" class="chips"></div>
  <select id="nAdd" aria-label="Přidat řešitele"><option value="">+ Přidat osobu nebo celou skupinu…</option>${addOpts()}</select>
  <p class="hint" id="nCnt"></p>
  <div class="grid2"><label>Termín<input type="date" id="nDue" value="${plus(7)}"></label><label>Zdroj<select id="nS">${sOpts('rucne')}</select></label></div></div>
  <div class="acts"><button class="btn pri" data-act="create">Vytvořit</button><button class="btn" data-act="close">Zrušit</button></div>`);
  renderChips();$('#nT').focus();
}
function addOpts(){return (gList().length?`<optgroup label="Skupiny (přidá všechny členy)">${gList().map(([id,g])=>`<option value="g:${esc(id)}">${esc(g.name)} (${(g.members||[]).length})</option>`).join('')}</optgroup>`:'')+
  `<optgroup label="Lidé">${mList().map(([id,m])=>`<option value="${esc(id)}">${esc(m.name)}${id===S.me?' (já)':''}${m.location?' – '+esc(m.location):''}</option>`).join('')}</optgroup>`}
function renderChips(){const c=$('#nChips');if(!c)return;const ids=[...S.nSel];
  c.innerHTML=ids.map(id=>`<span class="chip">${esc(nm(id))}<button data-act="nRm" data-id="${esc(id)}" aria-label="Odebrat ${esc(nm(id))}">×</button></span>`).join('')||'<span class="hint">Nikdo — úkol zůstane nepřiřazený.</span>';
  $('#nCnt').textContent=ids.length>1?`Vytvoří se ${ids.length} samostatné úkoly — každý řešitel splní svůj.`.replace('samostatné úkoly',ids.length>=5?'samostatných úkolů':'samostatné úkoly'):''}
async function create(){
  const title=$('#nT').value.trim();if(!title){toast('Vyplňte název');$('#nT').focus();return}
  const k=S.newKind,now=Date.now();
  const t={kind:k,title,desc:$('#nD').value.trim(),author:S.me,createdAt:now,updatedAt:now,source:k==='info'?'':$('#nS').value,log:[{t:now,by:S.me,a:k==='info'?'informace zveřejněna':'úkol vytvořen'}]};
  if(k==='task')Object.assign(t,{assignee:'',due:$('#nDue').value,status:'open',assignedAt:now,assignedBy:S.me,doneAt:0});
  const ids=[...S.nSel],batch=rid('b'),list=k==='task'?(ids.length?ids.map(id=>({...t,assignee:id,batch})):[t]):[t];
  const nids=await addTasks(list);if(nids){close();if(k==='task')notify(nids);toast(k==='info'?'Informace zveřejněna':list.length>1?`Vytvořeno: ${list.length} ${pl(list.length,'úkol','úkoly','úkolů')} — každý řešitel má svůj`:'Úkol vytvořen')}
}
async function saveTask(id){
  const t=S.tasks[id];if(!t)return;const info=t.kind==='info',title=$('#dT').value.trim(),desc=$('#dD').value.trim();
  if(!title){toast('Název nesmí být prázdný');return}
  const p={updatedAt:Date.now()},ch=[];

function matchAssignee(name){
  const n=norm(name);if(!n)return '';
  const g=gList().find(([,x])=>norm(x.name)===n||norm('skupina '+x.name)===n);if(g)return 'g:'+g[0];
  const ms=mList();let m=ms.find(([,x])=>norm(x.name)===n);if(m)return m[0];
  const parts=n.split(/\s+/);
  m=ms.find(([,x])=>{const xs=norm(x.name).split(/\s+/);return parts.some(p=>p.length>=3&&xs.some(q=>q.length>=3&&(q.startsWith(p.slice(0,4))||p.startsWith(q.slice(0,4)))))});
  return m?m[0]:'';
}
function heuristic(text){
  const rows=[],ms=mList(),year=new Date().getFullYear();
  const verbs=/(úkol|todo|akce|zajist|připrav|posl|zavol|domluv|ověř|navrhn|nastav|zpracuj|doplň|aktualiz|kontaktuj|objedn|zkontroluj)/i;
  for(let l of text.split(/\r?\n/)){l=l.trim();if(!l)continue;
    const m=l.match(/^(?:[-*•–]|\d+[.)]|\[ ?\])\s+(.+)/),inf=/^(info|informace)\s*:/i.test(l);if(!m&&!inf&&!verbs.test(l))continue;
    let s=(m?m[1]:l).replace(/^(úkol|todo|akce)\s*[:\-–]\s*/i,'');if(s.length<4)continue;
    let due='';const d=s.match(/(\d{1,2})\.\s?(\d{1,2})\.(?:\s?(\d{4}))?/);
    if(d){const y=+(d[3]||year);let c=`${y}-${String(+d[2]).padStart(2,'0')}-${String(+d[1]).padStart(2,'0')}`;if(!d[3]&&c<today())c=`${y+1}`+c.slice(4);due=c}
    const ns=norm(s);let who='';
    for(const [id,x] of gList())if(ns.includes(norm(x.name))){who='g:'+id;break}
    if(!who)for(const [id,x] of ms){if(norm(x.name).split(/\s+/).some(p=>p.length>=3&&ns.includes(p.slice(0,Math.min(4,p.length))))){who=id;break}}
    rows.push({on:true,title:s.slice(0,160),desc:'',assignee:who,due,kind:inf||/^(info|informace)\s*:/i.test(s)?'info':'task'});
  }
  return rows.slice(0,80);
}

async function readFile(f){

  const txt=await f.text();
  if(/^\s*[\[{]/.test(txt)){try{const j=JSON.parse(txt),out=[];const walk=(o,k)=>{if(typeof o==='string'){if(/text|content|display/i.test(k||''))out.push(o)}else if(Array.isArray(o))o.forEach(x=>walk(x,k));else if(o&&typeof o==='object')for(const [kk,v] of Object.entries(o))walk(v,kk)};walk(j,'');if(out.length)return out.join('\n')}catch(e){}}
  if(/^WEBVTT/.test(txt))return txt.split(/\r?\n/).filter(l=>l&&!/-->/.test(l)&&!/^WEBVTT|^\d+$/.test(l)).join('\n');
  return txt;
}

    case 'close':close();break;
    case 'nRm':S.nSel.delete(id);renderChips();break;
    case 'rmAs':if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Odebrat?';b.classList.add('arm');break}await busy(()=>removeAssignee(id,b.dataset.of));break;
    case 'new':openNew(b.id==='newBtn'&&S.view==='informace'?'info':b.dataset.kind);break;
    case 'nk':S.newKind=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('#nTF').hidden=S.newKind==='info';break;
    case 'create':await busy(create);break;
    case 'saveTask':await busy(()=>saveTask(id));break;
    case 'delegate':await busy(()=>delegate(id));break;
    case 'delTask':if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Opravdu smazat?';break}if(await del('tasks/'+id)){close();toast('Smazáno')}break;
    case 'toggle':await toggle(id);break;
    case 'dash':S.dash=b.dataset.v;render();break;
    case 'scope':S.scope=b.dataset.v;render();break;
    case 'go':S.scope=b.dataset.sc;S.fStatus=b.dataset.st;S.fSource='';S.q='';location.hash='ukoly';break;
    case 'parse':await parse();break;
    case 'createImport':await createImport();break;
    case 'clearImport':S.importRows=[];render();break;
    case 'saveCfg':{const d=Math.min(30,Math.max(1,parseInt(S.f.cfgDays??S.cfg.reminderDays,10)||4));const cfg={...S.cfg,reminderDays:d,emails:!!(S.f.cfgMail??(S.cfg.emails!==false))};
      if(await write('config/app',cfg)){delete S.f.cfgDays;delete S.f.cfgMail;toast('Nastavení uloženo')}break}
    case 'addMember':{const name=(S.f.addName||'').trim(),mail=(S.f.addMail||'').trim().toLowerCase();
      if(!name||!validMail(mail)){toast('Vyplňte jméno a platný e-mail');break}
      if(!domainOk(mail)){toast(`E-mail musí být @${S.srv.domain}`);break}
      if(Object.values(S.members).some(m=>m&&norm(m.email)===norm(mail))){toast('Uživatel s tímto e-mailem už existuje');break}
      if(await write('members/'+rid('p-'),{name,email:mail,role:S.f.addRole==='admin'?'admin':'user',location:(S.f.addLoc||'').trim(),position:(S.f.addPos||'').trim(),joined:0,seenAt:0})){
        ['addName','addMail','addLoc','addPos'].forEach(k=>delete S.f[k]);toast('Uživatel přidán: '+name);render()}break}
    case 'delMember':if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Opravdu odebrat?';break}if(await del('members/'+id))toast('Uživatel odebrán');break;
    case 'group':openGroup(id);break;
    case 'gAdd':{const k=b.dataset.k,v=$(k==='location'?'#gLoc':'#gPos').value;if(!v)break;let n=0;
      mList().forEach(([mid,m])=>{if((m[k]||'').trim()===v&&!S.gEdit.members.has(mid)){S.gEdit.members.add(mid);n++;const c=document.querySelector(`[data-gm="${CSS.escape(mid)}"]`);if(c)c.checked=true}});gCount();toast(`Přidáno ${n}`);break}
    case 'saveGroup':{const name=$('#gN').value.trim();if(!name){toast('Vyplňte název skupiny');break}
      if(await write('groups/'+S.gEdit.id,{name,desc:$('#gD').value.trim(),members:[...S.gEdit.members].filter(x=>S.members[x]),updatedAt:Date.now()})){close();toast('Skupina uložena')}break}
    case 'delGroup':if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Opravdu smazat skupinu?';break}if(await del('groups/'+S.gEdit.id)){close();toast('Skupina smazána')}break;
    case 'profile':openProfile();break;
    case 'saveProfile':{const name=$('#pN').value.trim();if(!name){toast('Vyplňte jméno');break}
      if(await write('members/'+S.me,{name,location:$('#pL').value.trim(),position:$('#pP').value.trim()},true)){close();toast('Profil uložen')}break}
    case 'notifOn':try{const p=await Notification.requestPermission();
      if(p==='granted'){const ok=await enablePush();toast(ok?'Upozornění zapnuta — počet úkolů uvidíte na ikoně':'Upozornění zapnuta')}else toast('Upozornění nebyla povolena');
      if(!$('#layer').hidden&&$('#pN'))openProfile();render()}catch(x){console.error(x)}break;
    case 'pushHide':localStorage.setItem('ukol-pushhide','1');render();break;
    case 'logout':close();await disablePush();await signOut(auth);break;
    case 'csv':csv();break;
    case 'onboard':await busy(onboard);break;
    case 'mode':S.authMode=b.dataset.v;renderAuth();break;
    case 'register':await busy(doRegister);break;
    case 'reset':{const em=$('#aE').value.trim();if(!validMail(em)){toast('Vyplňte e-mail');break}try{await sendPasswordResetEmail(auth,em);toast('Odkaz odeslán, zkontrolujte poštu.')}catch(err){toast(authErr(err))}break}
    case 'resend':try{await sendEmailVerification(auth.currentUser);toast('Odkaz odeslán znovu')}catch(err){toast(authErr(err))}break;
    case 'verified':await busy(async()=>{await auth.currentUser.reload();if(auth.currentUser.emailVerified){await auth.currentUser.getIdToken(true);handleUser(auth.currentUser)}else toast('E-mail zatím není ověřený.')});break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){S.q=el.value;$('#list').innerHTML=listHTML();return}
  if(el.dataset.bind){S.f[el.dataset.bind]=el.type==='checkbox'?el.checked:el.value;return}
  if(el.dataset.ir!=null){const r=S.importRows[+el.dataset.ir];if(!r)return;r[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;
    if(el.dataset.k==='on'){const on=S.importRows.filter(x=>x.on).length,g=$('#impGo');if(g){g.textContent=`Vytvořit ${on} ${pl(on,'položku','položky','položek')}`;g.disabled=!on}}}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='fStatus'){S.fStatus=el.value;$('#list').innerHTML=listHTML()}
  else if(el.id==='fSource'){S.fSource=el.value;$('#list').innerHTML=listHTML()}
  else if(el.id==='fGroup'){S.fGroup=el.value;render()}
  else if(el.id==='dAdd'&&el.value){const v=el.value;el.disabled=true;await addAssignees(el.dataset.of,v);el.disabled=false;el.value=''}
  else if(el.id==='nAdd'&&el.value){const v=el.value;if(v.startsWith('g:'))((grp(v)||{}).members||[]).map(resolve).filter(Boolean).forEach(x=>S.nSel.add(x));else S.nSel.add(v);el.value='';renderChips()}
  else if(el.dataset.gm&&S.gEdit){el.checked?S.gEdit.members.add(el.dataset.gm):S.gEdit.members.delete(el.dataset.gm);gCount()}
  else if(el.dataset.bind){S.f[el.dataset.bind]=el.type==='checkbox'?el.checked:el.value}
  else if(el.dataset.ir!=null){const r=S.importRows[+el.dataset.ir];if(r)r[el.dataset.k]=el.type==='checkbox'?el.checked:el.value}
  else if(el.dataset.mf){const id=el.dataset.mf,k=el.dataset.k,v=el.value.trim();if(v!==((S.members[id]||{})[k]||'')&&await write('members/'+id,{[k]:v},true))toast(`${nm(id)}: uloženo`)}
  else if(el.dataset.role){const id=el.dataset.role;if(await write('members/'+id,{role:el.value},true))toast(`${nm(id)}: ${el.value==='admin'?'administrátor':'uživatel'}`)}
  else if(el.id==='impFile'&&el.files[0]){const f=el.files[0];try{S.f.impText=await readFile(f);if(!S.f.impName)S.f.impName=f.name.replace(/\.[^.]+$/,'');S.importRows=[];render();toast('Soubor načten: '+f.name)}catch(err){toast('Soubor se nepodařilo přečíst.')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#layer').hidden)close();closeBell();closeMenu()}});
window.addEventListener('hashchange',route);

function handleUser(u){
  stopSubs();S.user=u;S.obKey='';Object.assign(S,{dash:'moje',scope:'moje',fGroup:'',fStatus:'aktivni',fSource:'',q:'',importRows:[],f:{}});if(u&&location.hash!=='#prehled')location.hash='prehled';
  if(!u){S.auth='signedout';S.me=null;render();return}
  if(!domainOk(u.email)){S.auth='baddomain';render();return}
  if(!u.emailVerified){S.auth='unverified';render();return}
  S.me=u.uid;S.email=u.email.toLowerCase();S.auth='ready';startSubs();render();setTimeout(enablePush,1500);
}
async function boot(){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  route();
  try{const r=await fetch('/api/config',{cache:'no-store'});S.srv=r.ok?await r.json():null}catch(e){S.srv=null}
  if(!S.srv||!S.srv.firebase||!S.srv.firebase.apiKey)S.srv=FALLBACK;
  if(!S.srv||!S.srv.firebase||!S.srv.firebase.apiKey){S.auth='noconfig';render();return}
  app=initializeApp(S.srv.firebase);auth=getAuth(app);auth.languageCode='cs';fdb=getFirestore(app);
  onAuthStateChanged(auth,handleUser);
}
boot();
</script>

</body></html>
